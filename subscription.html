<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASPHALT 9: LEGENDS - Subscription</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Racing+Sans+One&display=swap');

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-image: url(nissan-gtr-r35-thumb.jpg); /* Path to your background image */
            background-size: cover;
            background-position: center;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        header {
            background-color: #1a1a1a;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        header nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        header nav ul li {
            margin: 0 15px;
        }

        header nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            transition: color 0.3s ease, transform 0.3s ease; /* Added transition properties */
        }

        header nav ul li a:hover {
            color: #ff0066; /* Added hover color change */
            transform: scale(1.1); /* Added hover scale transformation */
        }

        .popup {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .popup-content {
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
        }

        .popup-content h2 {
            margin: 0;
            margin-bottom: 20px;
        }

        .popup-content input,
        .popup-content select {
            width: 95%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #fff;
            background: transparent;
            color: #fff;
            border-radius: 5px;
        }

        .popup-content input::placeholder {
            color: #ccc;
        }

        .popup-content button {
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 5px;
            background-color: #111111;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .popup-content button:hover {
            background-color: #222222;
        }

        .popup-content .checkbox-label {
            display: flex;
            align-items: baseline;
            justify-content: start;
            margin-bottom: 10px;
        }

        .popup-content .checkbox-label input {
            margin-right: 10px;
        }

        .popup-content .checkbox-label span {
            color: #fff;
        }

        .close-btn {
            background-color: #333;
        }

        /* Media query for screens below 768px width */
        @media screen and (max-width: 768px) {
            header nav ul {
                flex-direction: column;
                align-items: center;
            }

            header nav ul li {
                margin: 10px 0;
            }

            .popup-content {
                width: 90%;
            }

            .popup-content input,
            .popup-content select {
                width: 100%;
            }

            body {
                display: block;
                padding-top: 60px; /* Adjust padding to prevent content from being hidden behind fixed header */
                height: auto;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="esports.html">Esports</a></li>
                <li><a href="#" id="open-popup">Subscription</a></li>
            </ul>
        </nav>
    </header>

    <div class="popup" id="popup">
        <div class="popup-content">
            <h2>Subscription</h2>
            <input type="text" id="name" placeholder="Name">
            <input type="email" id="email" placeholder="Email">
            <input type="date" id="dob" placeholder="Date of Birth">
            <select id="gender">
                <option value="">Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <div class="checkbox-label">
                <input type="checkbox" id="terms">
                <span><u>terms and policy</u></span>
            </div>
            <button id="subscribe">Subscribe</button>
        </div>
    </div>

    <script>
        document.getElementById('subscribe').addEventListener('click', function () {
            const termsCheckbox = document.getElementById('terms');
            if (!termsCheckbox.checked) {
                alert('Please agree to the terms and policy.');
                return;
            }
            // Here you can add form validation and submission logic
            alert('Subscription successful!');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
