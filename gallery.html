<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASPHALT 9: CAR GALLERY</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Racing+Sans+One&display=swap');

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #0a0a0a;
            color: #fff;
        }

        header {
            background: linear-gradient(to right, #360138, #010027);
            padding: 10px 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        header nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        header nav ul li {
            margin: 0 5px;
        }

        header nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            padding: 10px 20px;
            border: 1px solid #fff;
            transition: background-color 0.3s, color 0.3s;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
        }

        header nav ul li a:hover {
            background-color: #3a3a3a;
            color: #00d4ff;
        }

        .no-box {
            border: none;
            padding: 0 20px;            
            font-family: 'Racing Sans One', sans-serif;
            font-size: 64px;
            background: linear-gradient(to bottom, #ffffff, #b4b4b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 8px rgb(255, 255, 255);
        }

        .car-gallery {
            margin-top: 100px; /* Adjust to ensure the header doesn't overlap */
            text-align: center;
            color: #00d4ff;
        }

        .car-title {
            font-family: 'Racing Sans One', sans-serif;
            font-size: 72px;
            background: linear-gradient(to bottom, #e4e4e4, b4b4b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0px 1px rgb(255, 255, 255);
        }

        .car-image {
            width: 100%;
            height: auto;
            margin-bottom: 40px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            background-color: #000;
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px;
        }

        .rank-nav {
            display: flex;
            margin-right: 40px; /* Added space between rank-nav and prev-next-nav */
        }

        .rank-nav a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            margin: 0 5px;
            padding: 10px 20px;
            border: 1px solid #00d4ff;
            transition: background-color 0.3s, color 0.3s;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
        }

        .rank-nav a:hover {
            background-color: #3a3a3a;
            color: #4a00e0;
        }

        .prev-next-nav a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            margin: 0 5px;
            padding: 10px 20px;
            border: 1px solid #00d4ff;
            transition: background-color 0.3s, color 0.3s;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
        }

        .prev-next-nav a:hover {
            background-color: #3a3a3a;
            color: #4a00e0;
        }

        footer {
            background: linear-gradient(to right, #303030, #000428);
            color: white;
            text-align: center;
            padding: 20px 0;
            position: relative;
            width: 100%;
            box-shadow: 0 -4px 8px rgba(0, 0, 0, 0.5);
        }

        .footer-description {
            margin-bottom: 10px;
        }

        .footer-links a {
            color: #ff0066;
            text-decoration: none;
            margin: 0 5px;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            text-decoration: underline;
            color: #00d4ff;
        }

        @media screen and (max-width: 768px) {
            header nav ul {
                flex-direction: column;
            }

            header nav ul li {
                margin: 10px 0;
            }

            .car-title {
                font-size: 48px;
            }

            .nav-bar {
                flex-direction: column;
            }

            .rank-nav, .prev-next-nav {
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li class="no-box">Asphalt 9: Rejends</li>
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html?class=D">D</a></li>
                <li><a href="gallery.html?class=C">C</a></li>
                <li><a href="gallery.html?class=B">B</a></li>
                <li><a href="gallery.html?class=A">A</a></li>
                <li><a href="gallery.html?class=S">S</a></li>
                <li style="margin-left: 50px;"><a href="#" id="prev-car">Prev</a></li>
                <li><a href="#" id="next-car">Next</a></li>
            </ul>
        </nav>
    </header>

    <div class="car-gallery">
        <h1 class="car-title" id="car-title"></h1>
        <img src="" alt="Car Image" class="car-image" id="car-image">
    </div>

    <footer>
        <div class="footer-description">
            Asphalt 9: Rejends - Experience the thrill of arcade racing with the world's most prestigious cars.
        </div>
        <div class="footer-links">
            <a href="#">Terms of Service</a> | <a href="#">Privacy Policy</a>
        </div>
        <p>&copy; 2024 Gamefolt and RJStudio</p>
    </footer>

    <script>
        const cars = {
            D: [
                { name: 'Bentley Continental GT3', image: 'Bentley-Continental-GT3.jpg' },
                { name: 'Honda Civic Type R', image: 'Honda-Civic-Type-R.jpg' },
                { name: 'Italdesign Davinci', image: 'Italdesign-Davinci.jpg' },
                { name: 'Renault TreZor', image: 'Renault-TreZor.jpg' },
                // Add more cars here for class D
            ],
            C: [
                { name: 'Ares S1', image: 'Asphalt-9-Ares-S1.jpg' },
                { name: 'Acura NSX GT3 Evo', image: 'Acura-NSX-GT3-Evo.jpg' },
                { name: 'Renault R.S. 01', image: 'Renault-R.S.-01.jpg' },
                { name: 'Saleen S1', image: 'Saleen-S1.jpg' },
                // Add more cars here for class C
            ],
            B: [
                { name: 'Aston Martin One77', image: 'Aston-Martin-One77.jpg' },
                { name: 'Arash AF10', image: 'Arash-AF10.jpg' },
                { name: 'Apollo IE', image: 'Apollo-IE.jpg' },
                { name: 'Apex AP 0', image: 'Apex-AP-0.jpg' },
                // Add more cars here for class B
            ],
            A: [
                { name: 'Aston Martin Victor', image: 'Aston-Martin-Victor.jpg' },
                { name: 'SCG 007S', image: 'SCG-007S.jpg' },
                { name: 'Jaguar C X75', image: 'Jaguar-C-X75.jpg' },
                { name: 'Lego Technic McLaren Senna GTR', image: 'Lego-Technic-McLaren-Senna-GTR.jpg' },
                // Add more cars here for class A
            ],
            S: [
                { name: 'Ajlani Drakuma', image: 'Ajlani-Drakuma.jpg' },
                { name: 'Aspark Owl', image: 'Aspark-Owl.jpg' },
                { name: 'BXR Bailey Blade GT1', image: 'BXR-Bailey-Blade-GT1.jpg' },
                { name: 'Inferno Automobili Inferno', image: 'Inferno-Automobili-Inferno.jpg' },
                // Add more cars here for class S
            ]
        };

        const urlParams = new URLSearchParams(window.location.search);
        const carClass = urlParams.get('class') || 'D';
        const carIndex = parseInt(urlParams.get('index')) || 0;

        function loadCar(classType, index) {
            const car = cars[classType][index];
            if (car) {
                document.getElementById('car-title').textContent = car.name;
                document.getElementById('car-image').src = car.image;
            }

            document.getElementById('prev-car').href = `gallery.html?class=${classType}&index=${Math.max(index - 1, 0)}`;
            document.getElementById('next-car').href = `gallery.html?class=${classType}&index=${Math.min(index + 1, cars[classType].length - 1)}`;
        }

        loadCar(carClass, carIndex);
    </script>
</body>
</html>
